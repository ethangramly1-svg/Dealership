<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#0e0e10" />
    </linearGradient>
    <radialGradient id="warmth" cx="80%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#c5a572" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0e0e10" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Anthracite base -->
  <rect width="1200" height="630" fill="url(#surface)" />
  <rect width="1200" height="630" fill="url(#warmth)" />

  <!-- Eyebrow -->
  <text
    x="80"
    y="170"
    font-family="'Inter Tight', 'Inter', system-ui, sans-serif"
    font-size="20"
    font-weight="500"
    fill="#c5a572"
    letter-spacing="5"
  >
    AUTONATION USA · CENTENNIAL · LAS VEGAS
  </text>

  <!-- Headline (Libre Caslon Display) -->
  <text
    x="80"
    y="320"
    font-family="'Libre Caslon Display', 'Big Caslon', Georgia, serif"
    font-size="118"
    font-weight="400"
    fill="#f3ede1"
    letter-spacing="-2"
  >
    The Showroom,
  </text>
  <text
    x="80"
    y="430"
    font-family="'Libre Caslon Display', 'Big Caslon', Georgia, serif"
    font-size="118"
    font-weight="400"
    fill="#f3ede1"
    letter-spacing="-2"
  >
    Reimagined.
  </text>

  <!-- Subline -->
  <text
    x="80"
    y="495"
    font-family="'Cormorant Garamond', Georgia, serif"
    font-style="italic"
    font-size="26"
    fill="#948b7a"
  >
    A small showroom of considered vehicles. No pressure, no theatrics.
  </text>

  <!-- Rating row -->
  <g transform="translate(80, 530)">
    <text x="0" y="22" font-family="system-ui" font-size="20" fill="#c5a572" letter-spacing="3">★★★★★</text>
    <text x="135" y="22" font-family="'Libre Caslon Display', Georgia, serif" font-size="22" fill="#c5a572">4.7</text>
    <text x="172" y="22" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="20" fill="#948b7a">· 812 reviews</text>
  </g>

  <!-- Restrained champagne mark in the corner -->
  <g transform="translate(1080, 90)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#c5a572" stroke-width="1.2" />
    <circle cx="0" cy="0" r="6" fill="#c5a572" />
  </g>
</svg>
