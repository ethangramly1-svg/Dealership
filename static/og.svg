<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg1" cx="20%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#b026ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#07071a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bg2" cx="90%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#07071a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="55%" stop-color="#b026ff" />
      <stop offset="100%" stop-color="#ff006e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="630" fill="#07071a" />
  <rect width="1200" height="630" fill="url(#bg1)" />
  <rect width="1200" height="630" fill="url(#bg2)" />

  <!-- Eyebrow -->
  <text
    x="80"
    y="160"
    font-family="'JetBrains Mono', monospace, system-ui"
    font-size="22"
    fill="#a0a0c0"
    letter-spacing="6"
  >
    AUTONATION USA · CENTENNIAL · LAS VEGAS
  </text>

  <!-- Big headline -->
  <text
    x="80"
    y="290"
    font-family="'Inter', system-ui, sans-serif"
    font-size="120"
    font-weight="900"
    fill="url(#title)"
    letter-spacing="-4"
  >
    The Showroom,
  </text>
  <text
    x="80"
    y="410"
    font-family="'Inter', system-ui, sans-serif"
    font-size="120"
    font-weight="900"
    fill="url(#title)"
    letter-spacing="-4"
  >
    Reimagined.
  </text>

  <!-- Subline -->
  <text
    x="80"
    y="490"
    font-family="'Inter', system-ui, sans-serif"
    font-size="28"
    fill="#f0f0ff"
    opacity="0.85"
  >
    A 3D used-car experience. No pressure. Fair offer.
  </text>

  <!-- Rating chip -->
  <g transform="translate(80, 540)">
    <rect width="240" height="44" rx="22" fill="rgba(0,240,255,0.08)" stroke="#00f0ff" stroke-opacity="0.4" />
    <text x="22" y="29" font-family="system-ui" font-size="20" fill="#ffd700">★★★★★</text>
    <text x="135" y="29" font-family="'Inter', system-ui" font-size="18" font-weight="700" fill="#f0f0ff">4.7</text>
    <text x="165" y="29" font-family="'Inter', system-ui" font-size="16" fill="#a0a0c0">812 reviews</text>
  </g>

  <!-- Decorative neon torus knot suggestion (top-right) -->
  <g transform="translate(960, 200)" filter="url(#glow)" opacity="0.85">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#00f0ff" stroke-width="3" />
    <circle cx="20" cy="-25" r="100" fill="none" stroke="#b026ff" stroke-width="3" />
    <circle cx="-15" cy="30" r="100" fill="none" stroke="#ff006e" stroke-width="3" />
  </g>
</svg>
